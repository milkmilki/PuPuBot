  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --font-sans: 'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      --font-serif: 'Instrument Serif', 'Songti SC', serif;
      --font-mono: 'Geist Mono', 'SFMono-Regular', monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px;
      overflow-x: auto;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame {
      width: min(1280px, 100%);
      min-width: 1064px;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
    }

    .subtitle {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .diagram-section {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(45, 49, 66, 0.12);
    }

    h2 {
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1064px;
      height: auto;
    }

    .footer {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid rgba(45, 49, 66, 0.12);
      color: var(--soft);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
